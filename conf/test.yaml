hydra:
  run:
    dir: .
    output_subdir: null
  job:
    chdir: false

date:
  year: 2025
  month: 8
  since_day: 6
  until_day: 6

settings:
  handle: grok
  query_type: Latest
  include_self_threads: false
  include_quotes: false
  include_retweets: false
  block_hours: 24
  number_conversations: 5
  build_final_json: false
  out_path: grok_data/data.json

logging:
  run_name: crawl_test
  to_stdout: false
