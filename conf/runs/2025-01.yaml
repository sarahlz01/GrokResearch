defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

hydra:
  run:
    dir: .
  job:
    chdir: false

date:
  year: 2025
  month: 1
  since_day: 1
  until_day: 31

settings:
  handle: grok
  query_type: Latest
  include_self_threads: false
  include_quotes: false
  include_retweets: false
  block_hours: 6
  number_conversations: 75
  build_final_json: false
  out_path: grok_data/data.json

logging:
  run_name: crawl_2025-01
  to_stdout: false
