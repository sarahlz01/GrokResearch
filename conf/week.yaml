date_month:
  year: 2025
  month: 8
  day: 2
  hour: 12 # UTC start hour

crawl:
  handle: grok
  query_type: Latest
  include_self_threads: false
  include_quotes: false
  include_retweets: false
  block_hours: 6
  number_conversations: 150
  build_final_json: true
  out_path: grok_data/data.json

logging:
  run_name: crawl
  to_stdout: true
