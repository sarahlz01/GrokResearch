defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

hydra:
  run:
    dir: .
  job:
    chdir: false

date:
  year: 2025
  month: 9
  since_day: 1
  until_day: 1

settings:
  handle: grok
  query_type: Latest
  include_self_threads: false
  include_quotes: false
  include_retweets: false
  block_hours: 8
  number_conversations: 1
  build_final_json: false
  out_path: grok_data/${date.year}-${date.month}-${date.since_day}to${date.until_day}.json
  grok_db_outpath: grok_data/test3/grok.sqlite3

logging:
  run_name: full
  log_dir: logs/test4
  to_stdout: false
